<!DOCTYPE html>
<html>
    <head>
        <meta charset=""UTF-8">
        <style type="text/css">
            ol li {list-style-type: lower-alpha;}
            ol {list-style-position: inside;}
            ul {list-style-position: outside;}
            li.kor {list-style-type: circle;}
            li.usa {list-style-type: square;}
            /* li.usa {list-style-image: url(.gif);} 머릿말에 쓰는 거니까 간단한 이미지를 띄울 수 있는 gif를 쓰는 게 좋음*/
            #book {width:50%; min-width: 600px; border-spacing: 8px;
            transform: rotate(90);}
            p {background-color: papayawhip;} 
            p :hover {background-color: palegreen; transition: background-color 5s;}
            ul {background-color: plum;}
            li {background-color: violet;}
            td {background-color: violet;}
        </style>
    </head>    
        <body>
            <p>순서가 없는 목록</p>
            <ul>
                <li class="usa">첫번째</li>
                <li class="kor">두번째</li>
                <li class="usa">세번째</li>
            </ul>
            <p>순서가 있는 목록</p>
            <ol>
                <li>첫번째</li>
                <li>두번째</li>
                <li>세번째</li>
            </ol>
            
            <table border="1" id="book">
                <tfoot>
                <tr>
                    <th>합계</th>
                    <td colspan="3">2권</td>
                </tr>
                </tfoot>

                <thead>
                    <tr>
                        <th>과목</th>
                        <th>책제목</th>
                        <th>저자</th>
                        <th>출판사</th>
                    </tr>
                </thead>
    
                <tbody>
                    <tr>
                        <td rowspan="2">웹프로그래밍</td>
                        <td>HTML5</td>
                        <td>임순범</td>
                        <td>생능</td>
                    </tr>

                    <tr>
                        <td>소셜미디어</td>
                        <td>최윤철</td>
                        <td>생능</td>
                    </tr>
                </tbody>
            </table>
        </body>


</html>
